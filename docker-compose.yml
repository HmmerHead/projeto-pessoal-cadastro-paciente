version: '3'

services:
    app:
        build: .
        container_name: paciente-app
        volumes:
            - .:/var/www
            - ./.docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
        networks:
            - app-network
        links:
            - db:db
        depends_on:
            - db
            - redis
        environment:
            DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    nginx:
        build: .docker/nginx
        container_name: paciente-nginx
        restart: always
        tty: true
        ports:
            - "8000:80"
        volumes:
            - .:/var/www
        networks:
            - app-network
        depends_on:
            - app

    db:
          build: ./.docker/postgres
          container_name: paciente-postgres
          volumes:
            - "./.docker/postgres/data:/var/lib/postgresql/data"
            - "./.docker/postgres/init-app-user.sql:/docker-entrypoint-initdb.d/10-app-user.sql:ro"
          environment:
            POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}
            POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
            POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
            DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
          networks:
            - app-network

    redis:
        image: redis:alpine
        container_name: paciente-redis
        networks:
            - app-network

networks:
    app-network:
        driver: bridge
